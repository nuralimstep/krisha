services:
  tracker:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - tracker-data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  tracker-data:
